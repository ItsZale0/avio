# Politica di traffico ngrok.
#
# L'header Host viene riscritto a localhost: l'app non si fida di Host
# diversi e ngrok lo usa per capire se la richiesta arriva dal suo dominio.
#
# L'header ngrok-skip-browser-warning evita la pagina di avviso di ngrok
# ("You are about to visit..."): senza, chi apre il link GitHub in un browser
# nuovo atterra su quella pagina e sembra che il servizio sia spento. Le
# chiamate API lo mandavano gia' dal frontend, ma la navigazione dal browser
# non puo' aggiungere header: qui lo aggiungiamo a tutte le richieste.
#
# L'app ha comunque la sua porta (password o chiave segreta): qui si evita
# solo la pagina di cortesia di ngrok.
on_http_request:
  - actions:
      - type: add-headers
        config:
          headers:
            host: localhost
            ngrok-skip-browser-warning: "1"
