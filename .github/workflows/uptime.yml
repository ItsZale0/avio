name: Sorvegliante app

# Questo controllo gira FUORI dalla VM: e' l'unica cosa che funziona
# anche quando la VM e' spenta (Oracle puo' spegnere le istanze Always
# Free che considera inattive).
#
# Se l'app non risponde:
#   1. prova a riavviare l'istanza (se le credenziali OCI sono configurate);
#   2. avvisa su Telegram;
#   3. fa fallire il controllo, cosi' GitHub manda anche l'email.

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - name: L'app risponde?
        env:
          URL: ${{ vars.CARPOOL_API_BASE }}
        run: |
          set -u
          if [ -z "${URL:-}" ]; then
            echo "::error::la variabile CARPOOL_API_BASE non e' impostata"
            exit 1
          fi
          code=$(curl -s -o /tmp/ping.json -w "%{http_code}" --max-time 30 "$URL/api/ping" || true)
          [ -n "$code" ] || code=000
          echo "Chiamata a $URL/api/ping -> HTTP $code"
          cat /tmp/ping.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::l'app non risponde (HTTP $code)"
            exit 1
          fi

      - name: Riavvia l'istanza Oracle (se le credenziali ci sono)
        if: failure()
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_INSTANCE_OCID: ${{ secrets.OCI_INSTANCE_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -u
          if [ -z "${OCI_INSTANCE_OCID:-}" ] || [ -z "${OCI_PRIVATE_KEY:-}" ]; then
            echo "Credenziali OCI non configurate: il riavvio automatico e' disattivato."
            echo "Le trovi in docs/ORACLE.md (sezione 'Se l'app non risponde')."
            exit 0
          fi
          # Si usa l'SDK Python di Oracle (il pacchetto "oci" su PyPI):
          # firma lui le richieste con la chiave, quindi non serve la CLI.
          python3 -m venv "$HOME/oci-venv"
          "$HOME/oci-venv/bin/pip" install --quiet --disable-pip-version-check oci
          "$HOME/oci-venv/bin/python" - <<'PY'
          import os

          # Import espliciti: il pacchetto "oci" carica i sottopacchetti solo
          # su richiesta. Il client dei calcoli sta in "oci.core" (in passato
          # qualcuno lo cercava in "oci.compute", che non esiste).
          from oci.config import validate_config
          from oci.core import ComputeClient

          config = {
              "user": os.environ["OCI_USER_OCID"],
              "fingerprint": os.environ["OCI_FINGERPRINT"],
              "tenancy": os.environ["OCI_TENANCY_OCID"],
              "region": "eu-milan-1",
              "key_content": os.environ["OCI_PRIVATE_KEY"],
          }
          validate_config(config)
          client = ComputeClient(config)
          instance_id = os.environ["OCI_INSTANCE_OCID"]
          risposta = client.get_instance(instance_id)
          stato = risposta.data.lifecycle_state
          print("stato dell'istanza:", stato)
          if stato == "RUNNING":
              print("l'istanza e' gia' accesa: non serve riavviarla")
          else:
              client.instance_action(instance_id, "START")
              print("avvio richiesto: l'istanza sta ripartendo")
          PY

      - name: Avvisa su Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -u
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Token Telegram non configurati: l'avviso arriva dalla notifica GitHub."
            exit 0
          fi
          risposta=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="AVIO non risponde. La VM potrebbe essere stata spenta da Oracle: si prova a riavvarla, se non basta si avvia a mano dalla console.")
          echo "$risposta"
          case "$risposta" in
            *'"ok":true'*) echo "avviso inviato su Telegram" ;;
            *) echo "::error::Telegram non ha confermato l'invio" ;;
          esac

      - name: Segnala il fallimento (GitHub avvisa via email)
        if: failure()
        run: |
          echo "::error::l'app non risponde: controlla la VM su Oracle"
          exit 1
