name: Deploy frontend su GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara il frontend
        run: |
          mkdir -p _site
          cp -r static/. _site/
          # config.json: URL del backend (tunnel) usato dalla PWA su Pages.
          # Lasciato vuoto di proposito: si configura dal file config.json
          # committato oppure via variabile CARPOOL_API_BASE.
          # updated_at permette al frontend di capire quale dei due
          # puntatori (config.json e backend.json sul branch) e' piu' fresco.
          if [ -n "${{ vars.CARPOOL_API_BASE }}" ]; then
            printf '{"apiBase":"%s","updated_at":"%s"}' \
              "${{ vars.CARPOOL_API_BASE }}" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/config.json
          fi
          # .nojekyll: evita che Jekyll tocchi i file con _ iniziale
          touch _site/.nojekyll
          # GitHub Pages mette in cache i file per 10 minuti e non supporta
          # header custom. L'unico modo per non servire una versione vecchia
          # di app.js/styles.css e' il cache-busting: il placeholder
          # __BUILD__ diventa l'hash del commit, quindi ogni deploy cambia
          # gli URL degli asset.
          BUILD="${{ github.sha }}"
          sed -i "s/__BUILD__/$BUILD/g" _site/index.html
          echo "Versione asset: $BUILD"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
